# Modelo de etapas: Site
# Lido pelo ModelosSeeder (fase 2). Editar aqui muda só serviços criados depois (RN-11).
# O Layout depende da entrega final do Rebranding quando o cliente tem as duas frentes (RN-15).

nome: Site
slug: site
revisoes_incluidas: 3
descricao: Site novo, textos para as buscas, perfil do Google e acompanhamento mensal.

etapas:
  - titulo: Acessos e dados do domínio
    tipo: pendencia_cliente
    duracao_dias_uteis: 3
    gasta_revisao: false
    descricao_cliente: >
      Adicione contato@dobra9.com.br como administrador do seu Perfil da Empresa no Google e do site
      atual, e nos envie o CPF ou CNPJ para registrar o domínio no seu nome. Nunca envie senhas por
      aqui: com o acesso de administrador, não precisamos delas.

  - titulo: Medição inicial das buscas
    tipo: trabalho_equipe
    duracao_dias_uteis: 2
    gasta_revisao: false
    descricao_cliente: >
      Registramos como a sua empresa aparece hoje no Google, antes de qualquer mudança. É a base de
      comparação dos relatórios.

  - titulo: Perfil do Google e cadastros corrigidos
    tipo: trabalho_equipe
    duracao_dias_uteis: 5
    gasta_revisao: false
    descricao_cliente: >
      Revisamos categorias, serviços, fotos e descrição do seu perfil no Google e corrigimos endereço
      e telefone nos diretórios.

  - titulo: Fotos, equipe, serviços e horários
    tipo: pendencia_cliente
    duracao_dias_uteis: 8
    gasta_revisao: false
    descricao_cliente: >
      Envie fotos e vídeos do espaço e do trabalho, a lista de serviços, a equipe e os horários.
      Vídeos acima de 50 MB: envie um link.

  - titulo: Mapa do site e textos
    tipo: aprovacao
    duracao_dias_uteis: 10
    gasta_revisao: true
    descricao_cliente: >
      A lista de páginas e os textos de cada uma, escritos para as buscas que seus clientes fazem.

  - titulo: Layout
    tipo: aprovacao
    duracao_dias_uteis: 8
    gasta_revisao: true
    descricao_cliente: >
      O visual da página inicial e dos modelos de páginas internas, já com a nova marca.

  - titulo: Site no link de teste
    tipo: aprovacao
    duracao_dias_uteis: 8
    gasta_revisao: true
    descricao_cliente: >
      O site funcionando num endereço de teste. Navegue pelo celular e pelo computador antes de aprovar.

  - titulo: Publicação
    tipo: trabalho_equipe
    duracao_dias_uteis: 2
    gasta_revisao: false
    descricao_cliente: >
      Site no ar no seu domínio, site antigo redirecionado e Google Search Console configurado.

  - titulo: Relatório mensal
    tipo: recorrente
    duracao_dias_uteis: 0
    gasta_revisao: false
    descricao_cliente: >
      Todo mês, um relatório de como a sua empresa está aparecendo nas buscas.
